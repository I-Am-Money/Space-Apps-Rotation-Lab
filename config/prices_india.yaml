operating_cost_rs_per_acre:
  rice:
    value: 38265
    badge: assumption
    source: Telangana A2+FL 72,353.64 Rs/ha (2020-21, DES via PJTSAU) x 1.3068 (all-India
      cost per quintal 2026-27 / 2020-21, PIB) x 0.404686. See cost_of_cultivation.
  jowar:
    value: 8018.47
    badge: assumption
    source: 'Explicit national-cost proxy, NOT a Telangana or farm cost observation:
      PIB 2026-27 all-India A2+FL cost 2682 Rs/quintal times detrended district potential
      yield 738.779 kg/ha /100 times 0.404686 ha/acre. Includes ordinary irrigation
      costs already; no separate water charge is deducted. https://www.pib.gov.in/PressReleasePage.aspx?PRID=2260617&reg=3&lang=1.
      No verified state budget for this crop is bundled. Override using actual farm
      costs.'
  bajra:
    value: 5983.42
    badge: assumption
    source: 'Explicit national-cost proxy, NOT a Telangana or farm cost observation:
      PIB 2026-27 all-India A2+FL cost 1858 Rs/quintal times detrended district potential
      yield 795.766 kg/ha /100 times 0.404686 ha/acre. Includes ordinary irrigation
      costs already; no separate water charge is deducted. https://www.pib.gov.in/PressReleasePage.aspx?PRID=2260617&reg=3&lang=1.
      No verified state budget for this crop is bundled. Override using actual farm
      costs.'
  ragi:
    value: 34062.71
    badge: assumption
    source: 'Explicit national-cost proxy, NOT a Telangana or farm cost observation:
      PIB 2026-27 all-India A2+FL cost 3470 Rs/quintal times detrended district potential
      yield 2425.669 kg/ha /100 times 0.404686 ha/acre. Includes ordinary irrigation
      costs already; no separate water charge is deducted. https://www.pib.gov.in/PressReleasePage.aspx?PRID=2260617&reg=3&lang=1.
      No verified state budget for this crop is bundled. Override using actual farm
      costs.'
  pigeonpea:
    value: 19535
    badge: assumption
    source: Telangana A2+FL 33,341.27 Rs/ha (2020-21, DES via PJTSAU) x 1.4478 (PIB
      cost ratio) x 0.404686. See cost_of_cultivation.
