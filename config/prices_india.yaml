# Prices and yield potentials for RotationLab (India). Rupees per quintal (100 kg).
# Accessed 2026-11-14. Every value carries a source; badge placeholder = not verified / not found.
msp:
  marketing_season: "Kharif Marketing Season 2026-27"
  announced: "2026-05-13"
  source: "PIB, Cabinet approves MSP for Kharif Crops for Marketing Season 2026-27, https://www.pib.gov.in/PressReleasePage.aspx?PRID=2260617&reg=3&lang=1 (table read from the cached page data/raw/msp_kharif_2026_27_pib_PRID2260617.html)"
  badge: observed
  rice:
    variety: "Paddy (Common)"
    msp_rs_per_quintal: 2441
    msp_prev_season_rs_per_quintal: 2369   # 2025-26, same table
    cost_a2fl_rs_per_quintal_allindia: 1627
    margin_pct: 50
  jowar:
    variety: "Jowar (Hybrid); Maldandi is listed separately at 4073"
    msp_rs_per_quintal: 4023
    msp_prev_season_rs_per_quintal: 3699
    cost_a2fl_rs_per_quintal_allindia: 2682
    margin_pct: 50
  bajra:
    variety: "Bajra"
    msp_rs_per_quintal: 2900
    msp_prev_season_rs_per_quintal: 2775
    cost_a2fl_rs_per_quintal_allindia: 1858
    margin_pct: 56
  pigeonpea:
    variety: "Tur (Arhar)"
    msp_rs_per_quintal: 8450
    msp_prev_season_rs_per_quintal: 8000
    cost_a2fl_rs_per_quintal_allindia: 5496
    margin_pct: 54
  ragi:
    variety: "Ragi"
    msp_rs_per_quintal: 5205
    msp_prev_season_rs_per_quintal: 4886
    cost_a2fl_rs_per_quintal_allindia: 3470
    margin_pct: 50
  cost_note: >
    PIB "Cost" column is the all-India weighted average cost of production per quintal
    (all paid-out costs plus imputed family labour, i.e. A2+FL), projected for 2026-27.
    It is per quintal, not per acre, and is not state-specific.

# Operating cost per acre: explicit national A2+FL proxy; no farm/state observation claimed.
# CACP cost-of-cultivation state tables were not reachable. Team to fill from CACP
# "Cost of Cultivation / Production" reports (cacp.da.gov.in), Cost A2+FL, Telangana or AP.
operating_cost_rs_per_acre:
  rice: {"value": 25170.92, "badge": "assumption", "source": "Explicit national-cost proxy, NOT a Telangana or farm cost observation: PIB 2026-27 all-India A2+FL cost 1627 Rs/quintal times detrended district potential yield 3822.904 kg/ha /100 times 0.404686 ha/acre. Includes ordinary irrigation costs already; extra irrigation charge defaults to zero. https://www.pib.gov.in/PressReleasePage.aspx?PRID=2260617&reg=3&lang=1. State per-acre tables could not be retrieved. Override using actual farm costs."}
  jowar: {"value": 8018.47, "badge": "assumption", "source": "Explicit national-cost proxy, NOT a Telangana or farm cost observation: PIB 2026-27 all-India A2+FL cost 2682 Rs/quintal times detrended district potential yield 738.779 kg/ha /100 times 0.404686 ha/acre. Includes ordinary irrigation costs already; extra irrigation charge defaults to zero. https://www.pib.gov.in/PressReleasePage.aspx?PRID=2260617&reg=3&lang=1. State per-acre tables could not be retrieved. Override using actual farm costs."}
  bajra: {"value": 5983.42, "badge": "assumption", "source": "Explicit national-cost proxy, NOT a Telangana or farm cost observation: PIB 2026-27 all-India A2+FL cost 1858 Rs/quintal times detrended district potential yield 795.766 kg/ha /100 times 0.404686 ha/acre. Includes ordinary irrigation costs already; extra irrigation charge defaults to zero. https://www.pib.gov.in/PressReleasePage.aspx?PRID=2260617&reg=3&lang=1. State per-acre tables could not be retrieved. Override using actual farm costs."}
  ragi: {"value": 34062.71, "badge": "assumption", "source": "Explicit national-cost proxy, NOT a Telangana or farm cost observation: PIB 2026-27 all-India A2+FL cost 3470 Rs/quintal times detrended district potential yield 2425.669 kg/ha /100 times 0.404686 ha/acre. Includes ordinary irrigation costs already; extra irrigation charge defaults to zero. https://www.pib.gov.in/PressReleasePage.aspx?PRID=2260617&reg=3&lang=1. State per-acre tables could not be retrieved. Override using actual farm costs."}
  pigeonpea: {"value": 13674.95, "badge": "assumption", "source": "Explicit national-cost proxy, NOT a Telangana or farm cost observation: PIB 2026-27 all-India A2+FL cost 5496 Rs/quintal times detrended district potential yield 614.838 kg/ha /100 times 0.404686 ha/acre. Includes ordinary irrigation costs already; extra irrigation charge defaults to zero. https://www.pib.gov.in/PressReleasePage.aspx?PRID=2260617&reg=3&lang=1. State per-acre tables could not be retrieved. Override using actual farm costs."}

# Potential yield Ym = 90th percentile of linearly detrended district yields (kg/ha),
# computed by engine/fetch_icrisat.py for Nalgonda (pre-2016 undivided district).
# Values come from the checksum-verified ICRISAT/TCI apportioned district table archived by the World Bank.
# Ragi has only 17 positive-yield years and is not selected for the optimizer.
potential_yield_kg_ha:
  district: Nalgonda
  rice: {"value": 3822.904, "badge": "modeled", "source": "P90 of linearly detrended ICRISAT/TCI apportioned DLD yields, Nalgonda code 59 (52 positive years; 1966-2017 table), recentered on final observed year. Archived by World Bank RR_IND_2025_488, https://reproducibility.worldbank.org/catalog/409; source checksum in data/raw/icrisat_dld/SOURCE.json. Derived statistic, not measured farm potential."}
  jowar: {"value": 738.779, "badge": "modeled", "source": "P90 of linearly detrended ICRISAT/TCI apportioned DLD yields, Nalgonda code 59 (52 positive years; 1966-2017 table), recentered on final observed year. Archived by World Bank RR_IND_2025_488, https://reproducibility.worldbank.org/catalog/409; source checksum in data/raw/icrisat_dld/SOURCE.json. Derived statistic, not measured farm potential."}
  bajra: {"value": 795.766, "badge": "modeled", "source": "P90 of linearly detrended ICRISAT/TCI apportioned DLD yields, Nalgonda code 59 (52 positive years; 1966-2017 table), recentered on final observed year. Archived by World Bank RR_IND_2025_488, https://reproducibility.worldbank.org/catalog/409; source checksum in data/raw/icrisat_dld/SOURCE.json. Derived statistic, not measured farm potential."}
  ragi: {"value": 2425.669, "badge": "modeled", "source": "P90 of linearly detrended ICRISAT/TCI apportioned DLD yields, Nalgonda code 59 (17 positive years; 1966-2017 table), recentered on final observed year. Archived by World Bank RR_IND_2025_488, https://reproducibility.worldbank.org/catalog/409; source checksum in data/raw/icrisat_dld/SOURCE.json. Derived statistic, not measured farm potential."}
  pigeonpea: {"value": 614.838, "badge": "modeled", "source": "P90 of linearly detrended ICRISAT/TCI apportioned DLD yields, Nalgonda code 59 (52 positive years; 1966-2017 table), recentered on final observed year. Archived by World Bank RR_IND_2025_488, https://reproducibility.worldbank.org/catalog/409; source checksum in data/raw/icrisat_dld/SOURCE.json. Derived statistic, not measured farm potential."}

