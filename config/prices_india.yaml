milled_rice_per_paddy:
  value: 0.66
  badge: observed
  source: 'ICRISAT VDSA ''all apportioned web document'' (https://vdsa.icrisat.org/Include/document/all-apportioned-web-document.pdf,
    read 2026-11-15): ''For paddy crop production figures refer to rice production
    for all districts ... converted into rice by using 0.66 as the conversion factor.''
    The Mendeley panel used here is derived from the same database (unapportioned
    version); team to confirm the unapportioned document says the same.'
