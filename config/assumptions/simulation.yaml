# RotationLab Feature 2 (Simulation and Tipping Points) settings. Owner: Feature 2.
# Read by engine/crops.py, engine/waterbalance.py, engine/yieldmodel.py, engine/scenarios.py, engine/tipping.py.
# Every leaf has value, range, unit, source, badge. Badges: observed | assumption | placeholder.
# "team to verify" = not read in a primary document; the value is flagged, not trusted.
#
# Sources, re-read from the FAO web copies on 2026-11-15:
#   FAO-56 (Allen et al. 1998) Table 11 (stage lengths) and Table 12 (Kc): https://www.fao.org/4/x0490e/x0490e0b.htm
#   FAO-56 Table 22 (root depth Zr and depletion fraction p): https://www.fao.org/4/x0490e/x0490e0e.htm
#   FAO-66 (Steduto et al. 2012) Table 1, "Seasonal Ky values from FAO I&D Paper No. 33": https://www.fao.org/4/i2800e/i2800e02.pdf
#   Calories: USDA FoodData Central (SR Legacy), https://fdc.nal.usda.gov
#   Runoff curve numbers: USDA NRCS National Engineering Handbook Part 630 ch.9 Table 9-1 (read 2026-11-14),
#     https://irrigationtoolbox.com/NEH/Part630_Hydrology/H_210_630_09.pdf
# Where a Kc ini cell is blank in Table 12 the crop-group value from the group header row is used and says so.
# root_depth_m is the middle of the Table 22 range (the table gives a range, not one value).
# Planting and climate-fit settings (season_type, t_plant_c, t_min_grow_c, t_max_grow_c), the heat settings and
# harvest_index were NOT read in a primary source: they are team rules of thumb, every one marked "team to verify".

rules:
  turnaround_days: {value: 7, range: [0, 21], unit: days, source: "Days between harvesting one crop and planting the next. Team choice, team to verify.", badge: assumption}
  climate_smoothing_days: {value: 31, range: [15, 45], unit: days, source: "Window of the running mean applied to the day-of-year temperature normals before planting rules are applied. Team choice.", badge: assumption}
  winter_wheat_maturity_c: {value: 22, range: [20, 24], unit: degC, source: "Winter wheat is taken as mature when the smoothed mean temperature first reaches this value after winter (or at the hottest day if it never does). Team rule of thumb, team to verify.", badge: assumption}
  winter_wheat_vernalization_max_c: {value: 12, range: [8, 14], unit: degC, source: "Winter wheat is offered only where the coldest part of the year has a smoothed mean temperature at or below this. Team rule of thumb, team to verify.", badge: assumption}
  winter_wheat_season_days: {value: [180, 335], range: [[150, 200], [300, 335]], unit: days, source: "Shortest and longest winter wheat seasons in FAO-56 Table 11 (180 Calif., 335 Idaho); the local season length is kept inside this range.", badge: observed}
  heat_pen_per_day: {value: 0.01, range: [0.0, 0.02], unit: "fraction of yield per hot day in the flowering window", source: "Carried over from Build Spec v3 section 5.4 (default 1 percent, range 0 to 2 percent). Team to verify.", badge: assumption}
  heat_enabled: {value: true, range: [false, true], unit: "on/off", source: "Heat penalty toggle (Person 2 task 7).", badge: assumption}
  dry_year_quantile: {value: 0.10, range: [0.05, 0.25], unit: "quantile of yearly rainfall", source: "A 'dry year' for the farmer's dry-year water supply answer is a 1-in-10 dry year; supply is interpolated between this and the median year. Team choice, team to verify.", badge: assumption}
  init_depletion_frac: {value: 0.5, range: [0.0, 1.0], unit: "fraction of column water capacity", source: "Soil water deficit at the very start of the spin-up pass. With the spin-up on (default) the result barely depends on it. Team to verify.", badge: assumption}
  cover_kc_start: {value: 0.70, range: [0.40, 0.70], unit: "-", source: "Kc of a cover crop while it is small. FAO-56 Table 12 has no cover-crop rows; stand-in: Winter Wheat Kc ini 0.7 (non-frozen soils). Team to verify.", badge: assumption}
  cover_kc_start_frozen: {value: 0.40, range: [0.40, 0.70], unit: "-", source: "Same, where the coldest month is below 0 degC. Stand-in: FAO-56 Table 12 Winter Wheat Kc ini 0.4 (frozen soils). Team to verify.", badge: assumption}
  cover_min_days: {value: 30, range: [14, 60], unit: days, source: "A cover crop is only grown when the gap between cash crops is at least this long. Team choice, team to verify.", badge: assumption}
  cover_terminate_days_before: {value: 14, range: [0, 30], unit: days, source: "A cover crop is terminated this many days before the next cash crop is planted. Team choice, team to verify.", badge: assumption}
  heat_shift_et0_pct_per_c: {value: 0.0, range: [0.0, 4.0], unit: "percent ET0 per degC", source: "What-if heat shift: extra reference evapotranspiration per degree of warming. 0 = the heat shift changes heat days only. Team to verify before turning on.", badge: assumption}
  n_bootstrap: {value: 500, range: [200, 1000], unit: plans, source: "Build Spec v4 R7: 500 bootstrap plans.", badge: assumption}
  seed: {value: 42, range: [42, 42], unit: "-", source: "Build Spec v4 A7: fixed random seed 42.", badge: assumption}
  default_awc_mm_per_m: {value: 150, range: [60, 200], unit: "mm of water per m of soil", source: "Used only when a caller gives no soil water capacity (single-season hindcast helper). Middle of the loam range; not re-read in a primary source, team to verify.", badge: placeholder}
  ym_min_reference_rel: {value: 0.25, range: [0.1, 0.5], unit: "-", source: "When a typical yield is turned into a potential yield, it is divided by the model's median relative yield for that crop at the site, never by less than this. Team choice, team to verify.", badge: assumption}
  ym_nass_quantile: {value: 0.90, range: [0.8, 0.95], unit: "quantile", source: "Final prompts v5, Person 2 task 4: potential yield = 90th percentile of detrended county yields.", badge: assumption}
  recent_years: {value: 20, range: [10, 30], unit: years, source: "Final prompts v5 task 7 (R8): 'Recent' climate mode counts the last 20 years twice.", badge: assumption}
  recent_weight: {value: 2.0, range: [1.0, 4.0], unit: "x", source: "Final prompts v5 task 7 (R8): the last 20 years count 2x in 'Recent' mode.", badge: assumption}
  trend_years_forward: {value: 10, range: [5, 20], unit: years, source: "Build Spec v4 R8: 'Continuing trend' carries the observed linear trend 10 years forward (counted from the last full year of the weather record). A what-if, not a forecast.", badge: assumption}
  trend_rain_mult_limits: {value: [0.5, 1.5], range: [[0.3, 0.8], [1.2, 2.0]], unit: "x", source: "Guard for 'Continuing trend': a real year's rain is never scaled by less or more than this when it is moved to the trend level. Team choice, team to verify.", badge: assumption}
  trend_et0_mult_limits: {value: [0.8, 1.25], range: [[0.6, 0.9], [1.1, 1.5]], unit: "x", source: "Guard for 'Continuing trend': same, for reference evapotranspiration. Team choice, team to verify.", badge: assumption}
  tipping_rain_mults: {value: [0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3], range: [0.5, 1.3], unit: "x rainfall", source: "Build Spec v4 R18: tipping points vs rainfall multiplier 0.5 to 1.3. Step 0.1 is a team choice.", badge: assumption}
  tipping_heat_shifts_c: {value: [0, 1, 2, 3], range: [0, 3], unit: degC, source: "Build Spec v4 R18: tipping points vs heat shift 0 to 3 degC. Step 1 degC is a team choice.", badge: assumption}
  tipping_water_fractions: {value: [0.0, 0.25, 0.5, 0.75, 1.0, 1.25], range: [0.0, 2.0], unit: "x the farmer's normal-year water supply", source: "Water supply levels tried on an irrigated farm (the dry-year answer is scaled by the same factor). Team choice, team to verify.", badge: assumption}
  tipping_water_levels_mm: {value: [0, 100, 200, 300, 400, 500], range: [0, 1000], unit: "mm per year", source: "Water supply levels tried on a rain-fed farm, or an irrigated farm that gave no amount ('what if you had this much irrigation water'). Team choice, team to verify.", badge: assumption}
  tipping_winner_scenarios: {value: 100, range: [40, 500], unit: plans, source: "How many of the 500 bootstrap plans (the first ones, seed 42) are used to find the winning rotation at each what-if point. The curves and their 10th to 90th percentile bands always use all 500. Team choice for speed (R23).", badge: assumption}
  tipping_min_scenarios: {value: 40, range: [20, 100], unit: plans, source: "The tipping search never uses fewer plans than this, however short the time budget. Team choice.", badge: assumption}
  tipping_time_budget_s: {value: 40, range: [10, 300], unit: seconds, source: "Time the tipping search aims for on a new farm; it uses fewer plans, then a coarser map, to stay near it, and says so on the result. Team choice (R23).", badge: assumption}
  tipping_max_crops: {value: 4, range: [2, 6], unit: crops, source: "What-if winners are searched among rotations of at most this many crops: the current plan's crops plus the crops of the three recommended picks, then the most profitable others. Team choice for speed (R23).", badge: assumption}
  tipping_crossover_resamples: {value: 200, range: [100, 1000], unit: resamples, source: "Bootstrap resamples (seed 42) used for the 10th to 90th percentile range of each tipping point. Team choice.", badge: assumption}
  default_cover_crop: {value: cereal_rye, range: [cereal_rye, oats_cover], unit: "cover crop id", source: "Cover crop used when a plan only says yes or no to a cover crop. Team choice (matches Feature 3).", badge: assumption}
  default_hydrologic_group: {value: B, range: [A, D], unit: group, source: "Used only when the soil source gives no hydrologic group. Team choice, team to verify.", badge: assumption}

# Daily runoff: SCS curve number. Values read in NRCS NEH Part 630 ch.9 Table 9-1 on 2026-11-14 (carried over from v3).
hydrology:
  cn_crop_group_A: {value: 67, range: [64, 72], unit: "-", source: "NRCS NEH 630 ch.9 Table 9-1 (p.9-2), Row crops, straight row, Good hydrologic condition, group A = 67 (Poor 72, SR+CR Good 64). https://irrigationtoolbox.com/NEH/Part630_Hydrology/H_210_630_09.pdf", badge: assumption}
  cn_crop_group_B: {value: 78, range: [75, 81], unit: "-", source: "NRCS NEH 630 Table 9-1, Row crops SR Good, group B = 78 (Poor 81, SR+CR Good 75). Same URL.", badge: assumption}
  cn_crop_group_C: {value: 85, range: [82, 88], unit: "-", source: "NRCS NEH 630 Table 9-1, Row crops SR Good, group C = 85 (Poor 88, SR+CR Good 82). Same URL.", badge: assumption}
  cn_crop_group_D: {value: 89, range: [85, 91], unit: "-", source: "NRCS NEH 630 Table 9-1, Row crops SR Good, group D = 89 (Poor 91, SR+CR Good 85). Same URL.", badge: assumption}
  cn_fallow_group_A: {value: 77, range: [74, 77], unit: "-", source: "NRCS NEH 630 Table 9-1, Fallow Bare Soil, group A = 77 (Crop residue Good 74). Same URL.", badge: assumption}
  cn_fallow_group_B: {value: 86, range: [83, 86], unit: "-", source: "NRCS NEH 630 Table 9-1, Fallow Bare Soil, group B = 86 (CR Good 83). Same URL.", badge: assumption}
  cn_fallow_group_C: {value: 91, range: [88, 91], unit: "-", source: "NRCS NEH 630 Table 9-1, Fallow Bare Soil, group C = 91 (CR Good 88). Same URL.", badge: assumption}
  cn_fallow_group_D: {value: 94, range: [90, 94], unit: "-", source: "NRCS NEH 630 Table 9-1, Fallow Bare Soil, group D = 94 (CR Good 90). Same URL.", badge: assumption}
  ia_ratio: {value: 0.2, range: [0.05, 0.2], unit: "-", source: "team to verify. Standard SCS initial abstraction ratio 0.2 (NEH-4); not read in a primary source.", badge: assumption}

# Days with no crop in the ground: evaporation from bare or residue-covered soil.
fallow:
  kc: {value: 0.30, range: [0.15, 0.50], unit: "-", source: "team to verify. Bare/fallow soil Kc between seasons; not read from FAO-56 ch.7.", badge: placeholder}
  evap_depth_m: {value: 0.12, range: [0.10, 0.15], unit: m, source: "team to verify. Depth of the surface layer that evaporates (FAO-56 ch.7 Ze); not read in a primary source.", badge: placeholder}
  depletion_fraction: {value: 0.5, range: [0.3, 0.7], unit: "-", source: "team to verify. Fraction of evaporation-layer water that evaporates at full rate.", badge: placeholder}

