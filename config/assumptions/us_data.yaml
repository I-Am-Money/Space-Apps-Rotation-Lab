# Feature 4 (US data, trust and submission) parameters. Owner: Person 3.
# Every value has a source note. "team to verify" = not yet checked against the cited source.
# Read by engine/fetch_nass.py, engine/fetch_ers.py, engine/us_rules.py.

nass:
  api_url: {value: "https://quickstats.nass.usda.gov/api/api_GET/", source: "NASS Quick Stats API docs, https://quickstats.nass.usda.gov/api"}
  default_years_for_mean:
    value: 5
    range: [3, 10]
    source: "Team choice: mean of the latest 5 county yields as the default yield (smooths one bad year). Team to verify."
  suppressed_codes:
    value: ["(D)", "(Z)", "(NA)", "(X)", "(S)", "(L)", "(H)"]
    source: "NASS Quick Stats symbol legend: (D) withheld to avoid disclosing individual operations, (Z) less than half the unit, (NA) not available, (X) not applicable, (S) insufficient reports, (L)/(H) coefficient of variation flags. https://quickstats.nass.usda.gov/src/glossary.pdf. Team to verify the full list."

# Engine crop id -> NASS Quick Stats query fields and unit conversions.
# lb -> kg 0.45359237 (exact, NIST); acre -> ha 0.40468564224 (exact, NIST).
# Bushel weights (lb/bu): corn and sorghum 56, soybeans and wheat 60, barley 48, oats 32 (USDA standard
# test weights; team to verify against the NASS "Weights, Measures and Conversion Factors" handbook AH-697).
# kg_ha_per_unit = lb_per_unit * 0.45359237 / 0.40468564224.
crops:
  maize:        {commodity_desc: CORN, util_practice_desc: GRAIN, yield_unit: BU / ACRE, lb_per_unit: 56, price_unit: $ / BU, price_lb_per_unit: 56}
  soybean:      {commodity_desc: SOYBEANS, yield_unit: BU / ACRE, lb_per_unit: 60, price_unit: $ / BU, price_lb_per_unit: 60}
  wheat_winter: {commodity_desc: WHEAT, class_desc: WINTER, yield_unit: BU / ACRE, lb_per_unit: 60, price_unit: $ / BU, price_lb_per_unit: 60, price_class_desc: ALL CLASSES}
  wheat_spring: {commodity_desc: WHEAT, class_desc: "SPRING, (EXCL DURUM)", yield_unit: BU / ACRE, lb_per_unit: 60, price_unit: $ / BU, price_lb_per_unit: 60, price_class_desc: ALL CLASSES}
  sorghum:      {commodity_desc: SORGHUM, util_practice_desc: GRAIN, yield_unit: BU / ACRE, lb_per_unit: 56, price_unit: $ / CWT, price_lb_per_unit: 100}
  barley:       {commodity_desc: BARLEY, yield_unit: BU / ACRE, lb_per_unit: 48, price_unit: $ / BU, price_lb_per_unit: 48}
  oats:         {commodity_desc: OATS, yield_unit: BU / ACRE, lb_per_unit: 32, price_unit: $ / BU, price_lb_per_unit: 32}
  cotton:       {commodity_desc: COTTON, class_desc: UPLAND, yield_unit: LB / ACRE, lb_per_unit: 1, price_unit: $ / LB, price_lb_per_unit: 1}
  rice:         {commodity_desc: RICE, yield_unit: LB / ACRE, lb_per_unit: 1, price_unit: $ / CWT, price_lb_per_unit: 100}
  peanut:       {commodity_desc: PEANUTS, yield_unit: LB / ACRE, lb_per_unit: 1, price_unit: $ / LB, price_lb_per_unit: 1}
# Field names follow the Quick Stats API parameter names. The exact class/util strings are team to verify
# against a live query (no NASS_API_KEY was available when this was written).

irrigated_share:
  source_desc: {value: CENSUS, source: "Census of Agriculture county tables via Quick Stats"}
  irrigated_short_desc: {value: "AG LAND, IRRIGATED - ACRES", source: "Quick Stats short_desc, Census of Agriculture. Team to verify."}
  cropland_short_desc: {value: "AG LAND, CROPLAND - ACRES", source: "Quick Stats short_desc, Census of Agriculture. Team to verify."}
  mostly_irrigated_threshold:
    value: 0.5
    range: [0.3, 0.7]
    source: "Team choice for R2: a county is 'mostly irrigated' when irrigated acres are at least half of cropland acres."

ers:
  cost_basis:
    value: operating
    choices: [operating, total_listed]
    source: >-
      ERS Commodity Costs and Returns. "operating" = Total, operating costs (seed, fertilizer, chemicals,
      fuel, repairs, custom work, irrigation water, interest). "total_listed" also includes allocated overhead
      (land and unpaid labor opportunity costs, capital recovery). Team choice: operating, because the land and
      labor opportunity costs are the same whichever rotation is chosen.
  csv_urls:
    source: "https://www.ers.usda.gov/data-products/commodity-costs-and-returns (downloaded 2026-11-15)"
    value:
      maize: https://www.ers.usda.gov/media/4962/corn.csv
      cotton: https://www.ers.usda.gov/media/4964/cotton.csv
      barley: https://www.ers.usda.gov/media/4966/barley.csv
      peanut: https://www.ers.usda.gov/media/4968/peanuts.csv
      rice: https://www.ers.usda.gov/media/4970/rice.csv
      sorghum: https://www.ers.usda.gov/media/4972/sorghum.csv
      oats: https://www.ers.usda.gov/media/4974/oats.csv
      soybean: https://www.ers.usda.gov/media/4976/soybeans.csv
      wheat_winter: https://www.ers.usda.gov/media/4978/wheat.csv
      wheat_spring: https://www.ers.usda.gov/media/4978/wheat.csv
  region_url: {value: "https://www.ers.usda.gov/sites/default/files/images/reglink.xls", source: "ERS 'Aggregating counties to ERS resource regions' (county FIPS -> region 1-9), downloaded 2026-11-15"}

us_rules:
  unsupported_states: {value: [AK, HI], source: "Spec v4 R2: Alaska and Hawaii not supported in this version"}
  orchard_tree_crops:
    source: "Spec v4 R2 and A10: orchards and tree crops not offered"
    value: [almonds, walnuts, pistachios, pecans, apples, cherries, peaches, pears, plums, prunes, apricots, oranges, grapefruit, lemons, tangerines, avocados, olives, grapes, hazelnuts, macadamias, citrus]
