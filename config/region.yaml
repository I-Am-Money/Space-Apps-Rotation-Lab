district: Nalgonda
state: Telangana
country: India
icrisat_district: Nalgonda   # pre-2016 (undivided) Nalgonda district, listed under Andhra Pradesh in ICRISAT DLD. See lineage note.
water_source: canal_and_well # canal_and_well (default) | unset | canal | borewell | tank; owner has not confirmed the real source, UI says "confirm your rice water source"
lat: 16.877                  # centroid of the district boundary polygon, see centroid_source
lon: 79.193
elevation_m: 216.37          # from the NASA POWER response geometry for (16.877, 79.193)
elevation_source: "NASA POWER daily point API v2.10.3, geometry.coordinates[2] (grid-cell elevation, not the farm's)"
weather_source: "NASA POWER daily, community AG; cached 1981-2025, model uses 1984-2025 (srad starts 1984)"
centroid_source: >
  Computed by the team (planar area-weighted centroid, equirectangular projection at the polygon's mean latitude)
  from the OpenStreetMap administrative boundary relation 2022221 "Nalgonda, Telangana, India"
  (admin_level 5, ref:LGD:district 514, wikidata Q15384), fetched via Nominatim
  https://nominatim.openstreetmap.org/lookup?osm_ids=R2022221&polygon_geojson=1 on 2026-11-14
  (saved data/raw/sources/osm_relation_2022221_nalgonda.geojson). Check: polygon area 7209 km2 vs
  7222.78 km2 stated for the district on en.wikipedia.org/wiki/Nalgonda_district (0.2 percent apart).
  This is the CURRENT (post-11-Oct-2016) Nalgonda district. Not the HQ town. The Wikidata coordinate
  (17.1, 79.3, Q15384) was not used: it is imported from English Wikipedia and sits near the HQ town.
icrisat_lineage_note: >
  ICRISAT district data are for the pre-2016 Nalgonda district, which was larger than today's
  (Suryapet and Yadadri Bhuvanagiri were created from it on 2016-10-11 per Wikipedia "Telangana
  districts" and the district pages, secondary sources). Verify the district name and its state
  label (Andhra Pradesh) against the ICRISAT DLD file itself (india-data). The POWER point is the
  current district centroid, so the weather is a regional estimate for the district, not the old boundary.
notes: >
  NASA POWER is a gridded product (the Daily API docs refer to a 0.5 x 0.5 degree global grid).
  The UI must say "regional estimate", never "your field". Elevation is the grid-cell value.
  load_weather(lat, lon) caches one JSON per point in data/raw/.
upstream_points:             # NASA POWER points in the Krishna basin UPSTREAM of Nagarjuna Sagar (79.31 E, 16.58 N)
  # Coordinates are dam/town locations from Wikidata (P625, accessed 2026-11-14), which are community data and
  # APPROXIMATE (+-1 arcmin). Each point is an anchor for a sub-basin, not a catchment centroid. POWER cells are ~0.5 degree.
  - name: Mahabaleshwar (Krishna source, Western Ghats)
    lat: 17.925
    lon: 73.6575
    reason: "Krishna rises near Mahabaleshwar in the Western Ghats (en.wikipedia.org/wiki/Krishna_River); the wettest headwater, so the whole river is downstream of it."
    source: "Wikidata Q463273 coordinate; en.wikipedia.org/wiki/Krishna_River 'Course'; accessed 2026-11-14"
  - name: Ujjani (Bhima sub-basin)
    lat: 18.0739
    lon: 75.12
    reason: "Ujjani is the terminal dam on the Bhima, the longest Krishna tributary (en.wikipedia Ujjani_Dam, Krishna_River); Bhima joins the Krishna upstream of Srisailam. Dam catchment 14,850 km2 (Wikipedia infobox, unverified against CWC)."
    source: "Wikidata Q7878222 coordinate; en.wikipedia.org/wiki/Ujjani_Dam; accessed 2026-11-14"
  - name: Almatti (Krishna main stem, Karnataka)
    lat: 16.331
    lon: 75.888
    reason: "Main reservoir of the Upper Krishna Project on the Krishna River; dam catchment 33,375 km2 (Wikipedia infobox, unverified against CWC). Upstream of Narayanpur, Jurala and Srisailam."
    source: "Wikidata Q3444765 coordinate; en.wikipedia.org/wiki/Almatti_Dam; accessed 2026-11-14"
  - name: Tungabhadra Dam (Tungabhadra sub-basin)
    lat: 15.2612
    lon: 76.3379
    reason: "Tungabhadra, a principal Krishna tributary, is impounded here; catchment 28,180 km2 (Wikipedia infobox, unverified against CWC). The Tungabhadra joins the Krishna at Srisailam reservoir, so this is upstream of Nagarjuna Sagar."
    source: "Wikidata Q7853026 coordinate; en.wikipedia.org/wiki/Tungabhadra_Dam and Srisailam_Dam; accessed 2026-11-14"
  - name: Srisailam (last reservoir above Nagarjuna Sagar)
    lat: 16.0869
    lon: 78.8972
    reason: "Srisailam Dam is built at the confluence of the Tungabhadra and Krishna; its catchment is 206,040 km2 against 214,185-215,000 km2 for Nagarjuna Sagar (Wikipedia infoboxes), so about 96 percent of Nagarjuna Sagar's catchment lies above it. Closest of the five to Nalgonda (about 0.3 degree), so it may share a POWER cell with local rain."
    source: "Wikidata Q1552235 coordinate; en.wikipedia.org/wiki/Srisailam_Dam, Nagarjuna_Sagar_Dam; accessed 2026-11-14"
upstream_caveat: "The mean of five 0.5 degree POWER points is a proxy for basin rainfall, not catchment inflow. Reservoir operations, evaporation, diversions and the Godavari-style inter-state sharing are not modelled."
crop_selection:                # owned by india-data
  millets: [bajra]             # PROVISIONAL: bajra is the only millet with real Nalgonda yields in the files we could fetch
  year_counts: {rice: 26, jowar: 0, bajra: 26, ragi: 0, pigeonpea: 0}   # 0 = crop absent from the fetched file, NOT zero yield
  years_covered: "1990-2015"
  status: provisional_fallback_data
  source: "Mendeley doi:10.17632/ywp3y5j9vv.1 (ICRISAT DLD derived, unapportioned) rows Dist Name=Nalgonda; the file has rice and pearl millet only. Official ICRISAT DLD CSVs (jowar, ragi, pigeonpea, 1966+) not reachable (data.icrisat.org times out; Dataverse DOI 10.21421/D2/XFB1BZ holds documentation only). Re-count and re-pick once the owner places the DLD CSVs in data/raw/icrisat_dld/ (python -m engine.fetch_icrisat)."
