  black_soil_awc_mm_per_m: {value: 180, range: [120, 200], unit: mm per m, source: "FAO-56 Table 19, Clay: theta_FC - theta_WP = 0.12-0.20 m3/m3 (= 120-200 mm/m). https://www.fao.org/4/x0490e/x0490e0c.htm, accessed 2026-11-14. Table is for generic clay, not Indian vertisol specifically; value in the upper part of the range for black soil, vertisol-specific range team to verify. farm.yaml awc_range_mm_per_m was still null when checked.", badge: assumption}

# ---------------------------------------------------------------------------------------------
# Added for Build Spec v3 (Nalgonda). Each value is an Assumption unless a primary source is named.
# ---------------------------------------------------------------------------------------------

# v3 section 6.2: one simple, documented onset rule. Sowing of every crop follows onset (engine/monsoon.py).
monsoon_onset:
  start_doy:      {value: 152, range: [152, 152], unit: day-of-year, source: "Build Spec v3 section 6.2: onset is searched from 1 June (day 152 of a 365-day year).", badge: assumption}
  window_days:    {value: 5, range: [3, 7], unit: days, source: "team to verify. Length of the wet window in the onset rule; chosen by the team, not read in a primary source.", badge: assumption}
  threshold_mm:   {value: 25, range: [20, 50], unit: mm, source: "team to verify. Rain needed inside the wet window; chosen by the team, not read in a primary source.", badge: assumption}
  dry_spell_days: {value: 10, range: [7, 15], unit: days, source: "team to verify. A wet window followed by this many dry days is a false start.", badge: assumption}
  dry_spell_mm:   {value: 5, range: [2.5, 10], unit: mm, source: "team to verify. Rain total below which the spell counts as dry.", badge: assumption}
  dry_search_days: {value: 30, range: [20, 40], unit: days, source: "team to verify. How far after the wet window a dry spell is looked for.", badge: assumption}
  last_doy:       {value: 244, range: [213, 244], unit: day-of-year, source: "team to verify. If no clean onset by 1 September the year is flagged and this day is used.", badge: assumption}

# v3 section 5.4: heat penalty (Assumption, toggle). Hot days = days in the flowering window with Tmax above the
# crop threshold; each hot day cuts Ya by pen_per_day. Flowering window = the first flowering_days of the FAO-56
# mid-season stage (the stage lengths are in crops.<crop>.stages_days). Thresholds are literature-typical values that
# were NOT read in a primary source in this session: team to verify.
heat:
  enabled:     {value: true, range: [false, true], unit: "on/off", source: "Build Spec v3 section 5.4 (toggle).", badge: assumption}
  pen_per_day: {value: 0.01, range: [0.0, 0.02], unit: "fraction of yield per hot day", source: "Build Spec v3 section 5.4: default 1 percent, range 0 to 2 percent.", badge: assumption}
  tmax_c:
    rice:      {value: 35, range: [33, 37], unit: degC, source: "team to verify. Tmax threshold at flowering, not read in a primary source.", badge: assumption}
    jowar:     {value: 38, range: [36, 40], unit: degC, source: "team to verify. Tmax threshold at flowering, not read in a primary source.", badge: assumption}
    bajra:     {value: 40, range: [38, 42], unit: degC, source: "team to verify. Tmax threshold at flowering, not read in a primary source.", badge: assumption}
    ragi:      {value: 38, range: [36, 40], unit: degC, source: "team to verify. Tmax threshold at flowering, not read in a primary source.", badge: assumption}
    pigeonpea: {value: 35, range: [33, 38], unit: degC, source: "team to verify. Tmax threshold at flowering, not read in a primary source.", badge: assumption}
  flowering_days:
    rice:      {value: 20, range: [10, 30], unit: days, source: "team to verify. Length of the flowering window from the start of the FAO-56 mid-season stage.", badge: assumption}
    jowar:     {value: 20, range: [10, 30], unit: days, source: "team to verify. Same definition.", badge: assumption}
    bajra:     {value: 15, range: [10, 25], unit: days, source: "team to verify. Same definition.", badge: assumption}
    ragi:      {value: 15, range: [10, 25], unit: days, source: "team to verify. Same definition.", badge: assumption}
    pigeonpea: {value: 30, range: [20, 45], unit: days, source: "team to verify. Same definition.", badge: assumption}

# Late-sowing penalty (Assumption, toggle). When the monsoon onset is late, every crop is sown late (section 6.2).
# A crop sown after its median-year date loses pen_per_day of its yield for each day of delay; sowing early earns
# nothing. Without this the model could reward a late monsoon (a later season is cooler and needs less water), which
# breaks the v3 section 11.2 test "Later monsoon onset never raises mean yield". The size is a team choice that was
# NOT read in a primary source in this session: team to verify.
late_sowing:
  enabled:     {value: true, range: [false, true], unit: "on/off", source: "Team choice to satisfy Build Spec v3 section 11.2 (onset monotonicity).", badge: assumption}
  pen_per_day: {value: 0.003, range: [0.0, 0.01], unit: "fraction of yield per day sown late", source: "team to verify. Kept small on purpose; not read in a primary source.", badge: assumption}

# v3 section 7: J(r) = (1 - lam) * mean_profit + lam * worst10 - w * irrigation_water * water_price_proxy.
objective:
  water_price_proxy_rs_per_mm_ha: {value: 50, range: [0, 100], unit: "INR per mm per ha", source: "Assumption, team to set. NOT a charge the farmer pays and never taken off profit: it only converts the water-saving slider into rupees. 50 INR per mm per ha equals 5 INR per cubic meter.", badge: assumption}

# v3 section 5.6: residue / soil-cover index (0 to 1), simple per-crop rule, shown as a trend line.
# cover_index[year] = carry * cover_index[year-1] + (1 - carry) * score(crop grown that year); year 0 = rice (our farm today).
soil_cover:
  carry:       {value: 0.5, range: [0.3, 0.7], unit: "-", source: "team to verify. How much of last year's cover index carries over.", badge: assumption}
  score:
    rice:      {value: 0.40, range: [0.2, 0.6], unit: "0 to 1", source: "team to verify. Relative residue and ground-cover score for puddled paddy; a ranking, not a measurement.", badge: assumption}
    jowar:     {value: 0.55, range: [0.4, 0.7], unit: "0 to 1", source: "team to verify. Relative score for sorghum stover.", badge: assumption}
    bajra:     {value: 0.50, range: [0.3, 0.7], unit: "0 to 1", source: "team to verify. Relative score for pearl millet stover.", badge: assumption}
    ragi:      {value: 0.50, range: [0.3, 0.7], unit: "0 to 1", source: "team to verify. Relative score for finger millet straw.", badge: assumption}
    pigeonpea: {value: 0.75, range: [0.5, 0.9], unit: "0 to 1", source: "team to verify. Relative score for a long-season legume with leaf fall.", badge: assumption}

# Team decision 2026-11-15: plans that grow the same non-rice crop in all 4 years are not offered.
# Rice x4 stays because it is the baseline ("our farm today"). Set to false to return to all 256 sequences.
plan_rules:
  block_same_nonrice_crop_4_years: {value: true, range: [false, true], unit: "on/off", source: "Team decision, 2026-11-15: continuous pigeon pea or millet for 4 years is not a plan a farmer would follow (disease and pest build-up); agronomy reference team to verify.", badge: assumption}

# ---------------------------------------------------------------------------------------------------------------
# Person 3 section: Soil Health Score (R11). Read by engine/soil_score.py. Nothing in this section is a soil test.
# Principles: USDA NRCS "Soil Health on Cropland" four principles: minimize disturbance, maximize soil cover,
#   maximize biodiversity, maximize continuous living roots.
#   https://www.nrcs.usda.gov/conservation-basics/soil/soil-health/soil-health-on-cropland
#   https://www.nrcs.usda.gov/sites/default/files/2023-06/Soil%20Health%20Principles%202.3.pdf
# The principles are NRCS's. Every number below (weights, points, targets) is a team modeling choice that turns
# the principles into a 0 to 100 score; none is an NRCS number. "team to verify" = not read in a primary source.
# Crop season lengths: [F56-T11] where a row was read (2026-11-15, https://www.fao.org/4/x0490e/x0490e0b.htm).
# ---------------------------------------------------------------------------------------------------------------
soil_score:
  label: {value: "Rule-based score from NRCS soil health principles. Not a soil test.", range: null, unit: text, source: "Required wording, Build Spec v4 R11.", badge: assumption}
  weights:
    cover:     {value: 0.25, range: [0.1, 0.4], unit: "share of base score", source: "Team choice, equal weight per NRCS principle (maximize soil cover). Team to verify.", badge: assumption}
    roots:     {value: 0.25, range: [0.1, 0.4], unit: "share of base score", source: "Team choice, equal weight per NRCS principle (maximize continuous living roots). Team to verify.", badge: assumption}
    diversity: {value: 0.25, range: [0.1, 0.4], unit: "share of base score", source: "Team choice, equal weight per NRCS principle (maximize biodiversity), includes legumes. Team to verify.", badge: assumption}
    residue:   {value: 0.25, range: [0.1, 0.4], unit: "share of base score", source: "Team choice: residue carbon input as a proxy for feeding soil biology. Team to verify.", badge: assumption}
  diversity:
    species_for_full_credit: {value: 4, range: [3, 6], unit: "distinct species in 4 years (cash + cover)", source: "Team choice. Team to verify.", badge: assumption}
    legume_share_for_full_credit: {value: 0.25, range: [0.25, 0.5], unit: "share of seasons with a legume (cash or cover)", source: "Team choice: one legume season in four years earns full legume credit. Team to verify.", badge: assumption}
    legume_part: {value: 0.4, range: [0.2, 0.6], unit: "share of diversity component", source: "Team choice. Team to verify.", badge: assumption}
  residue:
    carbon_fraction: {value: 0.45, range: [0.40, 0.47], unit: "kg C per kg residue dry matter", source: "Commonly used value for crop residue; team to verify against a primary source.", badge: placeholder}
    c_for_full_credit_t_ha_yr: {value: 4.0, range: [2.0, 5.0], unit: "t C/ha/yr", source: "Team choice for the top of the residue scale. Team to verify.", badge: assumption}
    dm_for_full_cover_t_ha: {value: 4.0, range: [2.0, 6.0], unit: "t residue dry matter/ha", source: "Team choice: residue amount treated as full surface cover in the off-season. Team to verify.", badge: assumption}
  repetition:
    points_per_repeat: {value: 5, range: [2, 10], unit: "points off per back-to-back season of the same cash crop", source: "Team choice reflecting NRCS biodiversity principle (monocultures are a biological disturbance). Team to verify.", badge: assumption}
    monoculture_extra_points: {value: 10, range: [5, 20], unit: "extra points off when one cash crop is the whole plan", source: "Team choice. Team to verify.", badge: assumption}
  tillage:
    points:
      no_till:      {value: 5, range: [0, 10], unit: points, source: "Team choice reflecting NRCS principle minimize disturbance. Team to verify.", badge: assumption}
      reduced:      {value: 0, range: [0, 5], unit: points, source: "Team choice (reference level). Team to verify.", badge: assumption}
      conventional: {value: -5, range: [-10, 0], unit: points, source: "Team choice reflecting NRCS principle minimize disturbance. Team to verify.", badge: assumption}
    residue_left_on_surface:
      no_till:      {value: 0.9, range: [0.7, 1.0], unit: "share of residue left on the surface", source: "Team to verify.", badge: placeholder}
      reduced:      {value: 0.5, range: [0.3, 0.7], unit: "share of residue left on the surface", source: "Team to verify.", badge: placeholder}
      conventional: {value: 0.15, range: [0.0, 0.3], unit: "share of residue left on the surface", source: "Team to verify.", badge: placeholder}
    default: {value: reduced, range: [no_till, reduced, conventional], unit: category, source: "Used when the farmer gives no tillage answer. Team choice.", badge: assumption}
  history_points:
    erosion:      {value: -5, range: [-10, 0], unit: points, source: "Team choice: field already shows erosion. Team to verify.", badge: assumption}
    waterlogging: {value: -3, range: [-10, 0], unit: points, source: "Team choice: field often waterlogged. Team to verify.", badge: assumption}
    salinity:     {value: -5, range: [-10, 0], unit: points, source: "Team choice: field has salinity. Team to verify.", badge: assumption}
  # Per crop: legume (yes/no), living_days (days of living cover and roots per season), harvest_index (grain / total
