    kc_mid:   {value: 1.05, range: [1.00, 1.10], unit: "-", source: "FAO-56 Table 12, Sorghum - grain: Kc mid 1.00-1.10 (midpoint chosen). https://www.fao.org/4/x0490e/x0490e0b.htm", badge: observed}
    kc_end:   {value: 0.55, range: [0.55, 0.55], unit: "-", source: "FAO-56 Table 12, Sorghum - grain: Kc end 0.55. https://www.fao.org/4/x0490e/x0490e0b.htm", badge: observed}
    stages_days: {value: [20, 35, 40, 30], range: [[20, 20], [35, 35], [40, 45], [30, 30]], unit: days, source: "FAO-56 Table 11, Sorghum: 20/35/40/30 = 130 (May/June, USA, Pakistan, Mediterranean); 20/35/45/30 = 140 (Mar/Apr, arid) gives the range. https://www.fao.org/4/x0490e/x0490e0b.htm", badge: observed}
    root_depth_m: {value: 1.0, range: [1.0, 2.0], unit: m, source: "FAO-56 Table 22, Sorghum-grain Zr 1.0-2.0 m (larger values for unlayered soils, footnote 1). Lower end chosen for shallow Deccan soils (team to verify the point). https://www.fao.org/4/x0490e/x0490e0e.htm", badge: observed}
    p:        {value: 0.55, range: [0.55, 0.55], unit: "-", source: "FAO-56 Table 22, Sorghum-grain p = 0.55 (for ETc about 5 mm/day). https://www.fao.org/4/x0490e/x0490e0e.htm", badge: observed}
    ky:       {value: 0.9, range: [0.9, 0.9], unit: "-", source: "FAO-33 seasonal Ky as reproduced in FAO I&D Paper 66, Table 1, p.7: Sorghum 0.9. https://www.fao.org/4/i2800e/i2800e02.pdf", badge: observed}
    sowing_doy: {value: 175, range: [160, 196], unit: day-of-year, source: "team to verify (assumed ~24 June, kharif).", badge: assumption}
  bajra:
    kc_ini:   {value: 0.30, range: [0.15, 0.60], unit: "-", source: "team to verify. FAO-56 Table 12 Kc ini cell for Millet is blank on the FAO web copy.", badge: placeholder}
    kc_mid:   {value: 1.00, range: [1.00, 1.00], unit: "-", source: "FAO-56 Table 12, row Millet: Kc mid 1.00. https://www.fao.org/4/x0490e/x0490e0b.htm", badge: observed}
    kc_end:   {value: 0.30, range: [0.30, 0.30], unit: "-", source: "FAO-56 Table 12, row Millet: Kc end 0.30. https://www.fao.org/4/x0490e/x0490e0b.htm", badge: observed}
    stages_days: {value: [15, 25, 40, 25], range: [[15, 20], [25, 30], [40, 55], [25, 35]], unit: days, source: "FAO-56 Table 11, Millet: 15/25/40/25 = 105 (June, Pakistan); 20/30/55/35 = 140 (April, central USA) gives the range. https://www.fao.org/4/x0490e/x0490e0b.htm", badge: observed}
    root_depth_m: {value: 1.0, range: [1.0, 2.0], unit: m, source: "FAO-56 Table 22, Millet Zr 1.0-2.0 m. Lower end chosen for shallow Deccan soils (team to verify the point). https://www.fao.org/4/x0490e/x0490e0e.htm", badge: observed}
    p:        {value: 0.55, range: [0.55, 0.55], unit: "-", source: "FAO-56 Table 22, Millet p = 0.55. https://www.fao.org/4/x0490e/x0490e0e.htm", badge: observed}
    ky:       {value: 0.9, range: [0.7, 1.1], unit: "-", source: "team to verify. Millet is not in FAO-66 Table 1 (FAO-33 values); sorghum value 0.9 used as a flagged stand-in.", badge: placeholder}
    sowing_doy: {value: 180, range: [160, 196], unit: day-of-year, source: "team to verify (assumed ~29 June, kharif).", badge: assumption}
  ragi:
