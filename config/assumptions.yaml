rice_irrigation:
  percolation_seepage_mm_day: {value: 2.0, range: [2.0, 8.0], unit: mm/day, source: "FAO Irrigation Water Management training manual, ch.4 Step 5 (Paddy rice irrigation schedule): heavy clay PERC = 2 mm/day, more sandy soils 8 mm/day, average 5 mm/day ('best determined locally'). https://www.fao.org/4/t7202e/t7202e07.htm, accessed 2026-11-14. Default set at the LOW end because the farm has black (cracking clay) soil that drains slowly; the farm's own percolation rate is team to verify.", badge: assumption}
  puddling_water_mm: {value: 200, range: [100, 300], unit: mm, source: "Value from FAO training manual ch.4 Step 4: water to saturate the root zone SAT = 200 mm (assumed in the manual). https://www.fao.org/4/t7202e/t7202e07.htm, accessed 2026-11-14. Range 100-300 is team to verify.", badge: assumption}
