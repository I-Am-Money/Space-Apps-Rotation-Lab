    kc_end:   {value: 0.35, range: [0.30, 0.35], unit: "-", source: "team to verify. Stand-in from the closest listed legume, as Build Spec v3 section 5.4 allows. Stand-in: FAO-56 Table 12 'Beans, dry and Pulses' / Chick pea Kc end 0.35.", badge: assumption}
    stages_days: {value: [25, 35, 70, 40], range: [[20, 30], [30, 45], [50, 90], [30, 50]], unit: days, source: "team to verify. No pigeon pea row in FAO-56 Table 11; 170-day total is a flagged guess for medium-duration kharif tur.", badge: placeholder}
