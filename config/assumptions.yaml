    p:        {value: 0.50, range: [0.45, 0.55], unit: "-", source: "team to verify. Stand-in from the closest listed legume, as Build Spec v3 section 5.4 allows. Not in FAO-56 Table 22; Chick pea p = 0.50 and Beans/Pulses 0.45 are the nearest rows.", badge: assumption}
    ky:       {value: 0.9, range: [0.7, 1.2], unit: "-", source: "team to verify. Pigeon pea is not in FAO-66 Table 1.", badge: placeholder}
    sowing_doy: {value: 175, range: [160, 196], unit: day-of-year, source: "team to verify (assumed ~24 June, kharif).", badge: assumption}

# >>> P2 crop_library (generated block, edit values here by hand if needed)
# ---------------------------------------------------------------------------------------------------------------
# Person 2 section (Build Spec v4): crop library for the universal app. Read by engine/crops.py (crop_library()).
# The v3 "crops:" block above stays for the v3 engine until api.py moves to v4.
# Sources, re-read from the FAO web copies on 2026-11-15:
#   FAO-56 Table 11 (stage lengths) and Table 12 (Kc): https://www.fao.org/4/x0490e/x0490e0b.htm
#   FAO-56 Table 22 (root depth Zr and depletion fraction p): https://www.fao.org/4/x0490e/x0490e0e.htm
#   FAO-66 Table 1, "Seasonal Ky values from FAO I&D Paper No. 33": https://www.fao.org/4/i2800e/i2800e02.pdf
#   Calories: USDA FoodData Central (SR Legacy), https://fdc.nal.usda.gov
# Where a Kc ini cell is blank in Table 12 the crop-group value from the group header row is used and says so.
# root_depth_m is the middle of the Table 22 range (the table gives a range, not one value).
# Planting and climate-fit settings (season_type, t_plant_c, t_min_grow_c, t_max_grow_c), the heat settings and
# harvest_index were NOT read in a primary source: they are team rules of thumb, every one marked "team to verify".
# ---------------------------------------------------------------------------------------------------------------
crop_library:
  rules:
    turnaround_days: {value: 7, range: [0, 21], unit: days, source: "Days between harvesting one crop and planting the next. Team choice, team to verify.", badge: assumption}
    climate_smoothing_days: {value: 31, range: [15, 45], unit: days, source: "Window of the running mean applied to the day-of-year temperature normals before planting rules are applied. Team choice.", badge: assumption}
    winter_wheat_maturity_c: {value: 22, range: [20, 24], unit: degC, source: "Winter wheat is taken as mature when the smoothed mean temperature first reaches this value after winter (or at the hottest day if it never does). Team rule of thumb, team to verify.", badge: assumption}
    winter_wheat_vernalization_max_c: {value: 12, range: [8, 14], unit: degC, source: "Winter wheat is offered only where the coldest part of the year has a smoothed mean temperature at or below this. Team rule of thumb, team to verify.", badge: assumption}
    winter_wheat_season_days: {value: [180, 335], range: [[150, 200], [300, 335]], unit: days, source: "Shortest and longest winter wheat seasons in FAO-56 Table 11 (180 Calif., 335 Idaho); the local season length is kept inside this range.", badge: observed}
    heat_pen_per_day: {value: 0.01, range: [0.0, 0.02], unit: "fraction of yield per hot day in the flowering window", source: "Carried over from Build Spec v3 section 5.4 (default 1 percent, range 0 to 2 percent). Team to verify.", badge: assumption}
    heat_enabled: {value: true, range: [false, true], unit: "on/off", source: "Heat penalty toggle (Person 2 task 7).", badge: assumption}
    dry_year_quantile: {value: 0.10, range: [0.05, 0.25], unit: "quantile of yearly rainfall", source: "A 'dry year' for the farmer's dry-year water supply answer is a 1-in-10 dry year; supply is interpolated between this and the median year. Team choice, team to verify.", badge: assumption}
    init_depletion_frac: {value: 0.5, range: [0.0, 1.0], unit: "fraction of column water capacity", source: "Soil water deficit at the very start of the spin-up pass. With the spin-up on (default) the result barely depends on it. Team to verify.", badge: assumption}
  crops:
    maize:
      name: {value: "Maize (corn, grain)", range: null, unit: "text", source: "Display name.", badge: observed}
      legume: {value: false, range: [false, true], unit: "flag", source: "Not a legume.", badge: observed}
      season_type: {value: warm, range: [warm, cool, winter], unit: "category", source: "warm = planted when it warms up; cool = planted in the cool part of the year; winter = fall-planted, overwinters. Team classification, team to verify.", badge: assumption}
      kc_ini: {value: 0.3, range: [0.3, 0.3], unit: "-", source: "FAO-56 Table 12: Cereals group Kc ini 0.3. https://www.fao.org/4/x0490e/x0490e0b.htm", badge: observed}
      kc_mid: {value: 1.2, range: [1.2, 1.2], unit: "-", source: "FAO-56 Table 12: Maize, Field (grain) 1.20.", badge: observed}
      kc_end: {value: 0.35, range: [0.35, 0.6], unit: "-", source: "FAO-56 Table 12: Maize, Field (grain) 0.60-0.35; 0.35 = grain dried in the field.", badge: observed}
      stages_days: {value: [30, 40, 50, 30], range: [[20, 30], [35, 50], [40, 60], [30, 50]], unit: "days", source: "FAO-56 Table 11: Maize (grain) 30/40/50/30 = 150, April, Spain and Calif. (other rows 125 to 180 days). https://www.fao.org/4/x0490e/x0490e0b.htm", badge: observed}
      root_depth_m: {value: 1.35, range: [1.0, 1.7], unit: "m", source: "FAO-56 Table 22: maximum root depth 1.0-1.7 m; the middle of the range is used. https://www.fao.org/4/x0490e/x0490e0e.htm", badge: observed}
      p: {value: 0.55, range: [0.5, 0.6], unit: "-", source: "FAO-56 Table 22: depletion fraction p = 0.55.", badge: observed}
      ky: {value: 1.25, range: [1.05, 1.45], unit: "-", source: "FAO-66 Table 1 (seasonal Ky from FAO-33): Maize 1.25. https://www.fao.org/4/i2800e/i2800e02.pdf", badge: observed}
      t_plant_c: {value: 13, range: [10, 16], unit: "degC", source: "Planted when the smoothed mean air temperature reaches this value. Team rule of thumb, team to verify.", badge: assumption}
      t_min_grow_c: {value: 8, range: [5, 11], unit: "degC", source: "The smoothed mean temperature must stay at or above this from planting to the end of mid-season. Team rule of thumb, team to verify.", badge: assumption}
      t_max_grow_c: {value: 30, range: [27, 33], unit: "degC", source: "The mean temperature over the mid-season stage must not exceed this. Team rule of thumb, team to verify.", badge: assumption}
      heat_tmax_c: {value: 35, range: [33, 37], unit: "degC", source: "A day with Tmax at or above this in the flowering window counts as a heat day. Not read in a primary source, team to verify.", badge: assumption}
      flowering_days: {value: 20, range: [10, 30], unit: "days", source: "Length of the heat-sensitive window from the start of the FAO-56 mid-season stage (0 = no heat penalty). Team to verify.", badge: assumption}
      harvest_index: {value: 0.5, range: [0.4, 0.6], unit: "-", source: "Harvested part as a share of above-ground dry matter, for residue (Person 3). Not read in a primary source, team to verify.", badge: placeholder}
      kcal_per_kg: {value: null, range: null, unit: "kcal/kg", source: "Not yet read from USDA FoodData Central, team to verify. Calories are not counted for this crop until it is.", badge: placeholder}
