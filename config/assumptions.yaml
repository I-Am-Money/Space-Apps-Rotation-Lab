  recharge_exponent_k: {value: 0.5, range: [0.0, 1.0], unit: "-", source: "simplified recharge proxy, team to verify. available = base * (season_rain/median_season_rain)^k.", badge: assumption}
  bund_height_mm: {value: 100, range: [50, 150], unit: mm, source: "team to verify. Maximum ponded depth; excess spills as runoff.", badge: assumption}
  water_source_labels: {value: {unset: "confirm your rice water source (local-rainfall recharge proxy)", borewell: "borewell (local-rainfall recharge proxy)", tank: "tank (local-rainfall recharge proxy)", canal: "proxy for canal water availability (Nagarjuna Sagar releases, not local rain)"}, range: [unset, borewell, tank, canal], unit: label, source: "Owner answer 2026-11-14; simplified proxy, team to verify.", badge: assumption}
  canal_release_factor: {value: 1.0, range: [0.2, 1.5], unit: "ratio to a normal-year release", source: "team to verify. Editable what-if multiplier on canal availability, NOT local rain. No reservoir release data is used or invented; 1.0 = normal year.", badge: assumption}
  canal_exponent_k: {value: 1.0, range: [0.5, 1.5], unit: "-", source: "team to verify. Proxy for canal water availability: available = base * canal_release_factor^k.", badge: assumption}
  base_canal: {value: 600, range: [200, 1200], unit: mm per season, source: "team to verify. Proxy for canal releases based on upstream monsoon rain; actual releases depend on reservoir operations. No reservoir data used.", badge: assumption}
  k_canal: {value: 1.0, range: [0.5, 1.5], unit: "-", source: "team to verify. S_canal = base_canal * (upstream_rain / median_upstream_rain)^k_canal.", badge: assumption}
